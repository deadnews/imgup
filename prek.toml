[update]
freeze = true

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
]

[[repos]]
repo = "https://github.com/rbubley/mirrors-prettier"
rev = "c035d5c3fc2ce295b961030061d09de67d9203dc" # frozen: v3.10.1
hooks = [
  { id = "prettier" },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "276087d9a4f06398b3e04825487805e2d7375888" # frozen: v1.52.2
hooks = [
  { id = "typos" },
]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "a76b92851fc9eede9f9bc4073eb55202f34eb0df" # frozen: 0.39.0
hooks = [
  { id = "check-github-workflows" },
  { id = "check-renovate" },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca" # frozen: v1.7.12
hooks = [
  { id = "actionlint" },
]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "06a39750ec31860bb44f2acf67182c40016cd1e7" # frozen: v1.32.0
hooks = [
  { id = "zizmor", args = ["--fix=safe"] },
]

[[repos]]
repo = "https://github.com/compwa/taplo-pre-commit"
rev = "ade0f95ddcf661c697d4670d2cfcbe95d0048a0a" # frozen: v0.9.3
hooks = [
  { id = "taplo-format" },
]

[[repos]]
repo = "https://github.com/aleksac/hadolint-py"
rev = "6e7504451511eaeb62a3e7f14d63b0296cbf86eb" # frozen: v2.15.1
hooks = [
  { id = "hadolint" },
]
