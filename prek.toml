[update]
freeze = true

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
]

[[repos]]
repo = "https://github.com/rbubley/mirrors-prettier"
rev = "331f33fa4dfbcbca7c3da3620c137fde0faab273" # frozen: v3.9.10
hooks = [
  { id = "prettier" },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "7f9d0819ca1c008ade73f4b41fa9d258d48f605b" # frozen: v1.51.1
hooks = [
  { id = "typos" },
]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "a76b92851fc9eede9f9bc4073eb55202f34eb0df" # frozen: 0.39.0
hooks = [
  { id = "check-github-workflows" },
  { id = "check-renovate" },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca" # frozen: v1.7.12
hooks = [
  { id = "actionlint" },
]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f" # frozen: v1.31.1
hooks = [
  { id = "zizmor", args = ["--fix=safe"] },
]

[[repos]]
repo = "https://github.com/compwa/taplo-pre-commit"
rev = "ade0f95ddcf661c697d4670d2cfcbe95d0048a0a" # frozen: v0.9.3
hooks = [
  { id = "taplo-format" },
]

[[repos]]
repo = "https://github.com/aleksac/hadolint-py"
rev = "6e7504451511eaeb62a3e7f14d63b0296cbf86eb" # frozen: v2.15.1
hooks = [
  { id = "hadolint" },
]
